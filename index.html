.form-range::-moz-range-track {

                &lt;th scope=&quot;col&quot;&gt;终点宽度 / End width&lt;/th&gt;

              &lt;/tr&gt;
            &lt;/thead&gt;

          &lt;/table&gt;

      &lt;/section&gt;
    &lt;/main&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;logarithmic-spiral-calculator&quot;);
      if (root == null) return;

      const SVG_NS = &quot;http://www.w3.org/2000/svg&quot;;
      const elements = {
        r0: root.querySelector(&quot;#lsc-r0&quot;),

        edgeEnd: root.querySelector(&quot;#lsc-edge-end&quot;),
        edgeOuter: root.querySelector(&quot;#lsc-edge-outer&quot;),

        pointInnerStart: root.querySelector(&quot;#lsc-point-inner-start&quot;),
        pointInnerEnd: root.querySelector(&quot;#lsc-point-inner-end&quot;),
        pointOuterEnd: root.querySelector(&quot;#lsc-point-outer-end&quot;),
        pointOuterStart: root.querySelector(&quot;#lsc-point-outer-start&quot;)
      };

      const limits = {
        r0: [1, 5000, 50],
        growth: [-1, 1, 0.2],
        cellCount: [1, 80, 10],
        deltaTheta: [1, 90, 20],
        lambda: [0, 3, 0.5]
      };

      let currentGeometry = null;
      let selectedIndex = 0;
      let dxfObjectUrl = null;
      const cameraState = {
        rotation: 0,
        zoom: 1,
        panX: 0,
        panY: 0,
        size: 640,
        center: { x: 320, y: 320 }
      };
      let spaceHeld = false;
      let dragState = null;

      const clamp = (value, [min, max, fallback]) =&gt; {
        if (!Number.isFinite(value)) return fallback;
        return Math.min(max, Math.max(min, value));
      };

      const readNumber = (element, range) =&gt; clamp(Number.parseFloat(element.value), range);

      function readParams() {
        return {
          r0: readNumber(elements.r0, limits.r0),
          growth: readNumber(elements.growth, limits.growth),
          cellCount: Math.round(readNumber(elements.cellCount, limits.cellCount)),
          deltaTheta: readNumber(elements.deltaTheta, limits.deltaTheta),
          lambda: readNumber(elements.lambda, limits.lambda)
        };
      }

      function polarPoint(radius, theta) {
        return {
          x: radius * Math.cos(theta),
          y: radius * Math.sin(theta),
          radius,
          theta
        };
      }

      function distance(a, b) {
        return Math.hypot(b.x - a.x, b.y - a.y);
      }

      function buildGeometry(params) {
        const deltaThetaRad = params.deltaTheta * Math.PI / 180;
        const innerBoundary = [];
        const outerBoundary = [];

        for (let i = 0; i &lt;= params.cellCount; i += 1) {
          const theta = i * deltaThetaRad;
          const innerRadius = params.r0 * Math.exp(params.growth * theta);
          const outerRadius = (1 + params.lambda) * innerRadius;
          innerBoundary.push(polarPoint(innerRadius, theta));
          outerBoundary.push(polarPoint(outerRadius, theta));
        }

        const cells = [];
        for (let i = 0; i &lt; params.cellCount; i += 1) {
          const points = [
            innerBoundary[i],
            innerBoundary[i + 1],
            outerBoundary[i + 1],
            outerBoundary[i]
          ];
          const edges = [
            distance(points[0], points[1]),
            distance(points[1], points[2]),
            distance(points[2], points[3]),
            distance(points[3], points[0])
          ];
          cells.push({
            index: i,
            points,
            edges,
            startAngle: points[0].theta,
            endAngle: points[1].theta
          });
        }

        return {
          cells,
          innerBoundary,
          outerBoundary,
          totalAngle: params.cellCount * deltaThetaRad
        };
      }

      function formatNumber(value) {
        return Number.isFinite(value) ? value.toFixed(2) : &quot;—&quot;;
      }

      function formatLength(value) {
        return `${formatNumber(value)} mm`;
      }

      function formatAngle(radians) {
        return `${formatNumber(radians * 180 / Math.PI)}°`;
      }

      function formatPoint(point) {
        return `(${formatNumber(point.x)}, ${formatNumber(point.y)}) mm`;
      }

      function dxfPair(code, value) {
        return `${code}\r\n${value}`;
      }

      function formatDxfCoordinate(value) {
        return Number.isFinite(value) ? value.toFixed(6) : null;
      }

      function dxfPolyline(layer, points, handle, closed = false) {
        if (!Array.isArray(points) || points.length &lt; 2) return &quot;&quot;;
        const values = points.flatMap((point) =&gt; [point.x, point.y]);
        if (!values.every(Number.isFinite)) return &quot;&quot;;
        return [
          dxfPair(0, &quot;LWPOLYLINE&quot;),
          dxfPair(5, handle),
          dxfPair(100, &quot;AcDbEntity&quot;),
          dxfPair(8, layer),
          dxfPair(100, &quot;AcDbPolyline&quot;),
          dxfPair(90, String(points.length)),
          dxfPair(70, closed ? &quot;1&quot; : &quot;0&quot;),
          dxfPair(43, &quot;0.0&quot;),
          ...points.flatMap((point) =&gt; [
            dxfPair(10, formatDxfCoordinate(point.x)),
            dxfPair(20, formatDxfCoordinate(point.y))
          ])
        ].join(&quot;\r\n&quot;);
      }

      function createDxf(geometry) {

        const sections = [

          dxfPair(100, &quot;AcDbSymbolTable&quot;),

          dxfPair(100, &quot;AcDbLinetypeTableRecord&quot;),

          dxfPair(70, &quot;0&quot;),
          dxfPair(0, &quot;LTYPE&quot;),
          dxfPair(5, &quot;15&quot;),
          dxfPair(100, &quot;AcDbSymbolTableRecord&quot;),
          dxfPair(100, &quot;AcDbLinetypeTableRecord&quot;),
          dxfPair(2, &quot;BYLAYER&quot;),
          dxfPair(70, &quot;0&quot;),
          dxfPair(0, &quot;LTYPE&quot;),
          dxfPair(5, &quot;16&quot;),
          dxfPair(100, &quot;AcDbSymbolTableRecord&quot;),
          dxfPair(100, &quot;AcDbLinetypeTableRecord&quot;),
          dxfPair(2, &quot;DASHED&quot;),
          dxfPair(70, &quot;0&quot;),
          dxfPair(3, &quot;Dashed __ __ __ __ __ __ __ __ __ __ __ __ __ _&quot;),
          dxfPair(72, &quot;65&quot;),
          dxfPair(73, &quot;2&quot;),

          dxfPair(74, &quot;0&quot;),
          dxfPair(0, &quot;ENDTAB&quot;),

        sections.push(

          dxfPair(2, &quot;STYLE&quot;),
          dxfPair(5, &quot;3&quot;),
          dxfPair(100, &quot;AcDbSymbolTable&quot;),
          dxfPair(70, &quot;1&quot;),
          dxfPair(0, &quot;STYLE&quot;),
          dxfPair(5, &quot;11&quot;),
          dxfPair(100, &quot;AcDbSymbolTableRecord&quot;),
          dxfPair(100, &quot;AcDbTextStyleTableRecord&quot;),
          dxfPair(2, &quot;STANDARD&quot;),
          dxfPair(70, &quot;0&quot;),
          dxfPair(0, &quot;ENDTAB&quot;),
          dxfPair(0, &quot;TABLE&quot;),
          dxfPair(2, &quot;VIEW&quot;),
          dxfPair(5, &quot;6&quot;),
          dxfPair(100, &quot;AcDbSymbolTable&quot;),
          dxfPair(70, &quot;0&quot;),
          dxfPair(0, &quot;ENDTAB&quot;),
          dxfPair(0, &quot;TABLE&quot;),

          dxfPair(5, &quot;7&quot;),
          dxfPair(100, &quot;AcDbSymbolTable&quot;),
          dxfPair(70, &quot;0&quot;),

          dxfPair(2, &quot;APPID&quot;),
          dxfPair(5, &quot;9&quot;),
          dxfPair(100, &quot;AcDbSymbolTable&quot;),

          dxfPair(70, &quot;0&quot;),

          dxfPair(100, &quot;AcDbSymbolTableRecord&quot;),

          dxfPair(0, &quot;SECTION&quot;),
          dxfPair(2, &quot;BLOCKS&quot;),
          dxfPair(0, &quot;BLOCK&quot;),
          dxfPair(5, &quot;20&quot;),
          dxfPair(100, &quot;AcDbEntity&quot;),
          dxfPair(100, &quot;AcDbBlockBegin&quot;),
          dxfPair(2, &quot;*MODEL_SPACE&quot;),
          dxfPair(0, &quot;ENDBLK&quot;),
          dxfPair(5, &quot;21&quot;),
          dxfPair(100, &quot;AcDbEntity&quot;),
          dxfPair(100, &quot;AcDbBlockEnd&quot;),
          dxfPair(0, &quot;BLOCK&quot;),
          dxfPair(5, &quot;1C&quot;),
          dxfPair(100, &quot;AcDbEntity&quot;),
          dxfPair(100, &quot;AcDbBlockBegin&quot;),
          dxfPair(2, &quot;*PAPER_SPACE&quot;),
          dxfPair(0, &quot;ENDBLK&quot;),
          dxfPair(5, &quot;1D&quot;),
          dxfPair(100, &quot;AcDbEntity&quot;),
          dxfPair(100, &quot;AcDbBlockEnd&quot;),
          dxfPair(0, &quot;ENDSEC&quot;),

          dxfPair(2, &quot;ENTITIES&quot;)
        );

        const appendPolyline = (points, layer) =&gt; {
          const polyline = dxfPolyline(layer, points, allocateHandle());
          if (polyline) sections.push(polyline);
        };

        appendPolyline(geometry.innerBoundary, &quot;INNER&quot;);
        appendPolyline(geometry.outerBoundary, &quot;OUTER&quot;);
        geometry.innerBoundary.forEach((inner, index) =&gt; {
          appendPolyline([inner, geometry.outerBoundary[index]], &quot;CONNECTORS&quot;);
        });
        sections.push(
          dxfPair(0, &quot;ENDSEC&quot;),
          dxfPair(0, &quot;SECTION&quot;),
          dxfPair(2, &quot;OBJECTS&quot;),
          dxfPair(0, &quot;DICTIONARY&quot;),
          dxfPair(5, &quot;C&quot;),
          dxfPair(100, &quot;AcDbDictionary&quot;),
          dxfPair(3, &quot;ACAD_GROUP&quot;),
          dxfPair(350, &quot;D&quot;),
          dxfPair(3, &quot;ACAD_MLINESTYLE&quot;),
          dxfPair(350, &quot;17&quot;),
          dxfPair(0, &quot;DICTIONARY&quot;),
          dxfPair(5, &quot;D&quot;),
          dxfPair(330, &quot;C&quot;),
          dxfPair(100, &quot;AcDbDictionary&quot;),
          dxfPair(0, &quot;DICTIONARY&quot;),
          dxfPair(5, &quot;1A&quot;),
          dxfPair(330, &quot;C&quot;),
          dxfPair(100, &quot;AcDbDictionary&quot;),
          dxfPair(0, &quot;DICTIONARY&quot;),
          dxfPair(5, &quot;17&quot;),
          dxfPair(100, &quot;AcDbDictionary&quot;),
          dxfPair(0, &quot;ENDSEC&quot;),
          dxfPair(0, &quot;EOF&quot;)
        );
        return `${sections.join(&quot;\r\n&quot;)}\r\n`;
      }

      function downloadDxf() {
        const params = readParams();
        const geometry = buildGeometry(params);
        const dxf = createDxf(geometry);
        const polylineCount = (dxf.match(/\r\nLWPOLYLINE\r\n/g) || []).length;
        const segmentCount = Math.max(0, geometry.innerBoundary.length - 1)
          + Math.max(0, geometry.outerBoundary.length - 1)
          + geometry.innerBoundary.length;
        if (polylineCount === 0 || segmentCount === 0) {
          elements.exportStatus.textContent = &quot;没有可导出的有效线段 / No valid line segments to export&quot;;
          elements.dxfDownload.hidden = true;
          return;
        }

        if (dxfObjectUrl != null) URL.revokeObjectURL(dxfObjectUrl);
        const blob = new Blob([dxf], { type: &quot;application/dxf&quot; });
        dxfObjectUrl = URL.createObjectURL(blob);
        const filename = `logarithmic-spiral-${params.cellCount}cells-fusion-r14-complete.dxf`;
        elements.dxfDownload.href = dxfObjectUrl;
        elements.dxfDownload.download = filename;
        elements.dxfDownload.textContent = &quot;点击下载 DXF 文件 / Click to download DXF&quot;;
        elements.dxfDownload.hidden = false;
        elements.dxfDownload.click();
        elements.exportStatus.textContent = `已生成 ${polylineCount} 个二维 DXF 多段线（共 ${segmentCount} 条线段） / Generated ${polylineCount} 2D DXF polylines (${segmentCount} line segments)；若未自动下载，请点击下方链接 / if the download did not start automatically, click the link below`;
      }

      function makeSvgElement(tag, attributes = {}) {
        const element = document.createElementNS(SVG_NS, tag);
        Object.entries(attributes).forEach(([key, value]) =&gt; element.setAttribute(key, String(value)));
        return element;
      }

      function getBounds(geometry) {
        const points = [...geometry.innerBoundary, ...geometry.outerBoundary];
        const xs = points.map((point) =&gt; point.x);
        const ys = points.map((point) =&gt; point.y);
        return {
          minX: Math.min(...xs),
          maxX: Math.max(...xs),
          minY: Math.min(...ys),
          maxY: Math.max(...ys)
        };
      }

      function createProjection(geometry, size) {
        const bounds = getBounds(geometry);
        const extentX = Math.max(bounds.maxX - bounds.minX, 1);
        const extentY = Math.max(bounds.maxY - bounds.minY, 1);
        const extent = Math.max(extentX, extentY);
        const padding = Math.max(28, size * 0.08);
        const scale = (size - padding * 2) / extent;
        const offsetX = (size - extentX * scale) / 2 - bounds.minX * scale;
        const offsetY = (size - extentY * scale) / 2 + bounds.maxY * scale;
        return (point) =&gt; ({
          x: point.x * scale + offsetX,
          y: offsetY - point.y * scale
        });
      }

      function pointsToPath(points) {
        return points.map((point, index) =&gt; `${index === 0 ? &quot;M&quot; : &quot;L&quot;}${point.x.toFixed(2)},${point.y.toFixed(2)}`).join(&quot; &quot;) + &quot; Z&quot;;
      }

      function openPath(points) {
        return points.map((point, index) =&gt; `${index === 0 ? &quot;M&quot; : &quot;L&quot;}${point.x.toFixed(2)},${point.y.toFixed(2)}`).join(&quot; &quot;);
      }

      function updateViewStatus() {
        const rotation = ((cameraState.rotation % 360) + 360) % 360;
        elements.viewStatus.textContent = `旋转 ${formatNumber(rotation)}° / Rotation ${formatNumber(rotation)}° · 缩放 ${formatNumber(cameraState.zoom * 100)}% / Zoom ${formatNumber(cameraState.zoom * 100)}% · 拖拽空白旋转 / drag blank area to rotate · 滚轮缩放 / scroll to zoom · 空格+拖拽平移 / Space + drag to pan`;
      }

      function updateCamera() {
        const cameraGroup = root.querySelector(&quot;#lsc-camera&quot;);
        if (cameraGroup == null) return;
        const { center, rotation, zoom, panX, panY } = cameraState;
        cameraGroup.setAttribute(
          &quot;transform&quot;,
          `translate(${center.x + panX} ${center.y + panY}) rotate(${rotation}) scale(${zoom}) translate(${-center.x} ${-center.y})`
        );
        updateViewStatus();
      }

      function drawGeometry(geometry) {
        if (geometry == null || elements.svg == null) return;
        const measuredWidth = elements.visualFrame?.clientWidth ?? 0;
        const size = Math.max(280, Math.round(measuredWidth || 560));
        const project = createProjection(geometry, size);
        cameraState.size = size;
        cameraState.center = { x: size / 2, y: size / 2 };
        elements.svg.setAttribute(&quot;viewBox&quot;, `0 0 ${size} ${size}`);
        elements.svg.replaceChildren();

        const axisGroup = makeSvgElement(&quot;g&quot;, { &quot;aria-hidden&quot;: &quot;true&quot; });
        axisGroup.append(
          makeSvgElement(&quot;line&quot;, { class: &quot;lsc-axis&quot;, x1: size / 2, y1: 14, x2: size / 2, y2: size - 14 }),
          makeSvgElement(&quot;line&quot;, { class: &quot;lsc-axis&quot;, x1: 14, y1: size / 2, x2: size - 14, y2: size / 2 })
        );
        elements.svg.append(axisGroup);

        const cameraGroup = makeSvgElement(&quot;g&quot;, { id: &quot;lsc-camera&quot;, &quot;aria-label&quot;: &quot;可旋转结构 / Rotatable structure&quot; });
        elements.svg.append(cameraGroup);

        const connectorGroup = makeSvgElement(&quot;g&quot;, { &quot;aria-hidden&quot;: &quot;true&quot; });
        geometry.innerBoundary.forEach((point, index) =&gt; {
          const inner = project(point);
          const outer = project(geometry.outerBoundary[index]);
          connectorGroup.append(makeSvgElement(&quot;line&quot;, {
            class: &quot;lsc-connector&quot;,
            x1: inner.x,
            y1: inner.y,
            x2: outer.x,
            y2: outer.y
          }));
        });
        cameraGroup.append(connectorGroup);

        const boundaryGroup = makeSvgElement(&quot;g&quot;, { &quot;aria-hidden&quot;: &quot;true&quot; });
        boundaryGroup.append(
          makeSvgElement(&quot;path&quot;, { class: &quot;lsc-boundary&quot;, d: openPath(geometry.innerBoundary.map(project)) }),
          makeSvgElement(&quot;path&quot;, { class: &quot;lsc-boundary&quot;, d: openPath(geometry.outerBoundary.map(project)) })
        );
        cameraGroup.append(boundaryGroup);

        const cellGroup = makeSvgElement(&quot;g&quot;, { &quot;aria-label&quot;: &quot;四边形单元 / Quadrilateral cells&quot; });
        geometry.cells.forEach((cell) =&gt; {
          const path = makeSvgElement(&quot;path&quot;, {
            class: `lsc-cell${cell.index === selectedIndex ? &quot; is-selected&quot; : &quot;&quot;}`,
            d: pointsToPath(cell.points.map(project)),
            &quot;data-cell-index&quot;: cell.index,
            role: &quot;button&quot;,
            tabindex: &quot;0&quot;,
            &quot;aria-label&quot;: `单元 ${cell.index + 1}，内侧边 / Inner edge ${formatLength(cell.edges[0])}`
          });
          path.addEventListener(&quot;pointerenter&quot;, () =&gt; selectCell(cell.index));
          path.addEventListener(&quot;focus&quot;, () =&gt; selectCell(cell.index));
          path.addEventListener(&quot;click&quot;, () =&gt; selectCell(cell.index));
          path.addEventListener(&quot;keydown&quot;, (event) =&gt; {
            if (event.key === &quot;Enter&quot; || event.key === &quot; &quot;) {
              event.preventDefault();
              selectCell(cell.index);
            }
          });
          cellGroup.append(path);
        });
        cameraGroup.append(cellGroup);

        const center = project({ x: 0, y: 0 });
        cameraGroup.append(makeSvgElement(&quot;circle&quot;, {
          class: &quot;lsc-center&quot;,
          cx: center.x,
          cy: center.y,
          r: 2.5,
          &quot;aria-hidden&quot;: &quot;true&quot;
        }));
        updateCamera();
      }

      function updateSelectedDetails(cell) {
        if (cell == null) return;
        elements.selectedIndex.textContent = `单元 ${cell.index + 1} / Cell ${cell.index + 1}`;
        elements.angleRange.textContent = `${formatAngle(cell.startAngle)} – ${formatAngle(cell.endAngle)}`;
        elements.edgeInner.textContent = formatLength(cell.edges[0]);
        elements.edgeEnd.textContent = formatLength(cell.edges[1]);
        elements.edgeOuter.textContent = formatLength(cell.edges[2]);
        elements.edgeStart.textContent = formatLength(cell.edges[3]);
        elements.pointInnerStart.textContent = formatPoint(cell.points[0]);
        elements.pointInnerEnd.textContent = formatPoint(cell.points[1]);
        elements.pointOuterEnd.textContent = formatPoint(cell.points[2]);
        elements.pointOuterStart.textContent = formatPoint(cell.points[3]);
      }

      function selectCell(index, options = {}) {
        if (currentGeometry == null || currentGeometry.cells.length === 0) return;
        selectedIndex = Math.min(currentGeometry.cells.length - 1, Math.max(0, Number(index) || 0));
        root.querySelectorAll(&quot;.lsc-cell&quot;).forEach((cellElement) =&gt; {
          const isSelected = Number(cellElement.dataset.cellIndex) === selectedIndex;
          cellElement.classList.toggle(&quot;is-selected&quot;, isSelected);
          if (isSelected) cellElement.setAttribute(&quot;aria-pressed&quot;, &quot;true&quot;);
          else cellElement.removeAttribute(&quot;aria-pressed&quot;);
        });
        root.querySelectorAll(&quot;.lsc-row-select&quot;).forEach((rowButton) =&gt; {
          const isSelected = Number(rowButton.dataset.cellIndex) === selectedIndex;
          rowButton.setAttribute(&quot;aria-pressed&quot;, String(isSelected));
          rowButton.closest(&quot;tr&quot;)?.classList.toggle(&quot;is-selected&quot;, isSelected);
        });
        updateSelectedDetails(currentGeometry.cells[selectedIndex]);
        if (options.focus === true) {
          root.querySelector(`.lsc-cell[data-cell-index=&quot;${selectedIndex}&quot;]`)?.focus();
        }
      }

      function isCellTarget(target) {
        return target instanceof Element &amp;&amp; target.closest(&quot;.lsc-cell&quot;) != null;
      }

      function clientToViewBoxScale() {
        const width = elements.svg.clientWidth || cameraState.size;
        return cameraState.size / width;
      }

      function beginViewDrag(event) {
        if (event.button !== 0) return;
        if (isCellTarget(event.target) &amp;&amp; !spaceHeld) return;
        dragState = {
          mode: spaceHeld ? &quot;pan&quot; : &quot;rotate&quot;,
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          startRotation: cameraState.rotation,
          startPanX: cameraState.panX,
          startPanY: cameraState.panY
        };
        elements.svg.classList.add(&quot;is-dragging&quot;);
        elements.svg.setPointerCapture(event.pointerId);
        event.preventDefault();
      }

      function moveViewDrag(event) {
        if (dragState == null || event.pointerId !== dragState.pointerId) return;
        const dx = event.clientX - dragState.startX;
        const dy = event.clientY - dragState.startY;
        if (dragState.mode === &quot;rotate&quot;) {
          cameraState.rotation = dragState.startRotation + dx * 0.5;
        } else {
          const scale = clientToViewBoxScale();
          cameraState.panX = dragState.startPanX + dx * scale;
          cameraState.panY = dragState.startPanY + dy * scale;
        }
        updateCamera();
        event.preventDefault();
      }

      function endViewDrag(event) {
        if (dragState == null || (event.pointerId != null &amp;&amp; event.pointerId !== dragState.pointerId)) return;
        if (elements.svg.hasPointerCapture?.(dragState.pointerId)) {
          elements.svg.releasePointerCapture(dragState.pointerId);
        }
        dragState = null;
        elements.svg.classList.remove(&quot;is-dragging&quot;);
      }

      function zoomView(event) {
        event.preventDefault();
        const multiplier = event.deltaY &lt; 0 ? 1.1 : 0.9;
        cameraState.zoom = Math.min(5, Math.max(0.5, cameraState.zoom * multiplier));
        updateCamera();
      }

      function installViewInteractions() {
        elements.svg.addEventListener(&quot;pointerdown&quot;, beginViewDrag);
        elements.svg.addEventListener(&quot;pointermove&quot;, moveViewDrag);
        elements.svg.addEventListener(&quot;pointerup&quot;, endViewDrag);
        elements.svg.addEventListener(&quot;pointercancel&quot;, endViewDrag);
        elements.svg.addEventListener(&quot;wheel&quot;, zoomView, { passive: false });
        window.addEventListener(&quot;keydown&quot;, (event) =&gt; {
          const tagName = event.target?.tagName;
          if (event.code === &quot;Space&quot; &amp;&amp; ![&quot;INPUT&quot;, &quot;TEXTAREA&quot;, &quot;SELECT&quot;].includes(tagName)) {
            spaceHeld = true;
            if (elements.svg.matches(&quot;:hover&quot;) || dragState != null) event.preventDefault();
          }
        });
        window.addEventListener(&quot;keyup&quot;, (event) =&gt; {
          if (event.code === &quot;Space&quot;) spaceHeld = false;
        });
      }

      function renderCellTable(geometry) {
        elements.tableBody.replaceChildren();
        geometry.cells.forEach((cell) =&gt; {
          const row = document.createElement(&quot;tr&quot;);
          const unitCell = document.createElement(&quot;th&quot;);
          unitCell.scope = &quot;row&quot;;
          const button = document.createElement(&quot;button&quot;);
          button.type = &quot;button&quot;;
          button.className = &quot;lsc-row-select&quot;;
          button.dataset.cellIndex = cell.index;
          button.textContent = String(cell.index + 1);
          button.setAttribute(&quot;aria-label&quot;, `查看单元 ${cell.index + 1} 详情 / View details for cell ${cell.index + 1}`);
          button.addEventListener(&quot;click&quot;, () =&gt; selectCell(cell.index));
          unitCell.append(button);
          row.append(unitCell);
          cell.edges.forEach((edge) =&gt; {
            const valueCell = document.createElement(&quot;td&quot;);
            valueCell.className = &quot;lsc-number&quot;;
            valueCell.textContent = formatLength(edge);
            row.append(valueCell);
          });
          elements.tableBody.append(row);
        });
      }

      function updateSummary(geometry) {
        const params = readParams();
        elements.summary.innerHTML = `&lt;span&gt;&lt;strong&gt;${geometry.cells.length}&lt;/strong&gt; 个单元&lt;/span&gt;&lt;span&gt;总转角 / Total rotation &lt;strong&gt;${formatAngle(geometry.totalAngle)}&lt;/strong&gt;&lt;/span&gt;&lt;span&gt;λ = &lt;strong&gt;${formatNumber(params.lambda)}&lt;/strong&gt;&lt;/span&gt;`;
      }

      function recompute() {
        const previousIndex = selectedIndex;
        const params = readParams();
        currentGeometry = buildGeometry(params);
        selectedIndex = Math.min(previousIndex, currentGeometry.cells.length - 1);
        drawGeometry(currentGeometry);
        renderCellTable(currentGeometry);
        updateSummary(currentGeometry);
        selectCell(selectedIndex);
      }

      [elements.r0, elements.growth, elements.cellCount, elements.deltaTheta, elements.lambda].forEach((input) =&gt; {
        input.addEventListener(&quot;input&quot;, recompute);
      });

      elements.exportDxf.addEventListener(&quot;click&quot;, downloadDxf);
      installViewInteractions();

      const resizeObserver = new ResizeObserver(() =&gt; {
        if (currentGeometry != null) {
          drawGeometry(currentGeometry);
          selectCell(selectedIndex);
        }
      });
      resizeObserver.observe(elements.visualFrame);
      recompute();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {
